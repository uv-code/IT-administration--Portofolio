<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-900 & AB-900</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07111f;
        color: #f5f7ff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #07111f 0%, #0f172a 100%);
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 2.5vw, 2.2rem);
      }

      .header p {
        margin: 0;
        color: #9ca3af;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .card-header {
        padding: 16px 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      }

      .card-header h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }

      .card-header p {
        margin: 0;
        color: #94a3b8;
        font-size: 0.95rem;
      }

      iframe {
        width: 100%;
        height: 75vh;
        min-height: 500px;
        border: 0;
        background: white;
      }

      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        iframe { height: 60vh; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="header">
        <h1>AZ-900 & AB-900</h1>
        <p>Die beiden Azure-Zertifikate sind hier zusammengefasst und können direkt über die jeweiligen Links geöffnet werden.</p>
      </section>

      <div class="actions">
        <a href="/certs/az-900.pdf" target="_blank" rel="noreferrer">AZ-900 PDF öffnen</a>
        <a href="/certs/ab-900.pdf" target="_blank" rel="noreferrer">AB-900 PDF öffnen</a>
      </div>

      <div class="grid">
        <article class="card">
          <div class="card-header">
            <h2>AZ-900 – Azure Fundamentals</h2>
            <p>Direkte Vorschau des Zertifikats.</p>
          </div>
          <iframe src="/certs/az-900.pdf" title="AZ-900 PDF"></iframe>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>AB-900 – Azure Basics</h2>
            <p>Direkte Vorschau des Zertifikats.</p>
          </div>
          <iframe src="/certs/ab-900.pdf" title="AB-900 PDF"></iframe>
        </article>
      </div>
    </main>
  </body>
</html>
